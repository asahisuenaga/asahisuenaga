name: Update README Date
on:
  schedule:
    - cron: '0 0 * * *' # Every night
  workflow_dispatch:   # Manual trigger button in Actions tab

jobs:
  update:
    # Use latest ubuntu image which supports Node 24
    runs-on: ubuntu-latest 
    permissions:
      contents: write # Crucial permission to allow pushing changes
    steps:
      - uses: actions/checkout@v4 # Already on v4, standard for Node 20/24 compatibility
      
      - name: Update Date
        run: |
          # Matches MM.DD.YY format (e.g., 5.27.26) and replaces it with today's date
          DATE=$(date +'%m.%d.%y')
          # Specific regex to target the README version in your bash block
          sed -i "s/README v[0-9]\{1,2\}.[0-9]\{1,2\}.[0-9]\{2\}/README v$DATE/g" README.md
          
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          # Only commits if there is a change to prevent workflow failure
          git commit -m "Update README version to $(date +'%m.%d.%y')" || echo "No changes to commit"
          git push
