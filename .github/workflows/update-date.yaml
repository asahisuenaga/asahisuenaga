name: Update README Date
on:
  schedule:
    - cron: '0 0 * * *' # Every night
  workflow_dispatch:   # Manual trigger button in Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial for the bot to push changes
    steps:
      - uses: actions/checkout@v4
      
      - name: Update Date
        run: |
          # Matches MM.DD.YY format and replaces it with today's date
          DATE=$(date +'%m.%d.%y')
          sed -i "s/[0-9]\{1,2\}.[0-9]\{1,2\}.[0-9]\{2\}/$DATE/g" README.md
          
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "Update README version to $(date +'%m.%d.%y')" || echo "No changes"
          git push
