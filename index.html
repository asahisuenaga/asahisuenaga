                </div>

        </main>
        <div class="notes-backdrop" id="notes-backdrop"></div>
        <div class="notes-modal" id="notes-modal">
            <div class="notes-drawer-handle" id="notes-drawer-handle"></div>
            <div class="mac-stoplights" id="shared-stoplights" style="position: absolute; top: 20px; left: 16px; z-index: 100; transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1); margin-top: 6px; display: flex; gap: 6px; align-items: center;"><button class="mac-close" aria-label="Close"></button><button class="mac-min" aria-label="Minimize"></button><button class="mac-max" aria-label="Maximize"></button></div>
            <div class="notes-panel" id="panel-folders">
                <div class="notes-header">
                    <div class="notes-header-left"></div>
                    <button id="new-folder-btn-top" class="notes-glass-btn" aria-label="New Folder" title="New Folder" style="margin-left: auto; width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center;"><img alt="Folder Badge Plus" src="icons/folder.badge.plus.svg" style="width: 24px; height: 24px;" draggable="false"></button>
                </div>
                <div class="notes-content notes-content-padded" style="display:flex; flex-direction:column;">
                    <h1 class="notes-large-title">Folders</h1>
                    <div class="notes-list-group">
                        <div class="notes-list-item folder-list-item" data-target="panel-notes-all" style="user-select: none;">
                            <div class="notes-folder-info"><img alt="Folder" src="icons/folder.svg" style="width:18px; height:18px; display:inline-block; vertical-align:-3px;" draggable="false">All Notes</div>
                            <div><span class="notes-count" id="count-all"></span></div>
                        </div>
                        <div class="notes-list-item folder-list-item" data-target="panel-notes-personal" style="user-select: none;">
                            <div class="notes-folder-info"><img alt="Folder" src="icons/folder.svg" style="width:18px; height:18px; display:inline-block; vertical-align:-3px;" draggable="false">Personal</div>
                            <div><span class="notes-count" id="count-personal">0</span></div>
                        </div>
                        <div class="notes-list-item folder-list-item" data-target="panel-notes-projects" style="user-select: none;">
                            <div class="notes-folder-info"><img alt="Folder" src="icons/folder.svg" style="width:18px; height:18px; display:inline-block; vertical-align:-3px;" draggable="false">Projects</div>
                            <div><span class="notes-count" id="count-projects">0</span></div>
                        </div>
                        <div class="notes-folder-divider" style="height: 1px; background: var(--heading); opacity: 0.15; margin: 8px 0;"></div>
                        <div class="notes-list-item folder-list-item" data-target="panel-notes-deleted" style="user-select: none;">
                            <div class="notes-folder-info"><img alt="Trash" src="icons/trash.svg" style="width:18px; height:18px; display:inline-block; vertical-align:-3px;" draggable="false">Deleted</div>
                            <div><span class="notes-count" id="count-deleted">0</span></div>
                        </div>
                    </div>
                </div>
                <div class="notes-footer"><button class="notes-glass-btn" aria-label="New Folder" id="new-folder-btn" title="New Folder"><img alt="Folder Badge Plus" src="icons/folder.badge.plus.svg" style="width:20px; height:20px;"></button></div>
            </div>
            <div class="notes-panel" id="panel-notes">
                <div class="notes-header">
                    <div class="notes-header-left"><button class="notes-glass-btn notes-back" aria-label="Return" data-back="panel-folders" style="display: none;"><img alt="Chevron Left" src="icons/chevron.left.svg" class="back-hero-icon" style="width:16px; height:16px; display:inline-block; vertical-align:-3px;" draggable="false"></button><button class="notes-glass-btn" aria-label="Sidebar" id="sidebar-toggle" title="Sidebar" oncontextmenu="return false;" style="margin-left: 0px; transition: margin-left 0.3s cubic-bezier(0.25, 1, 0.5, 1);"><img alt="Sidebar Left" src="icons/sidebar.left.svg" style="width:18px; height:18px; display:inline-block; vertical-align:-3px;" draggable="false"></button></div>
                    <button id="new-note-btn-header" class="notes-glass-btn" aria-label="New Note" title="New Note"><img alt="Square and Pencil" src="icons/square.and.pencil.svg" draggable="false"></button>
                </div>
                <div class="notes-content notes-content-padded">
                    <h1 class="notes-large-title" id="notes-header-title">All Notes</h1>
                    <div class="notes-list-group" id="notes-list-container"></div>
                </div>
            </div>
            <div class="notes-panel" id="panel-note-view">
                <div class="notes-header">
                    <div class="notes-header-left"><button class="notes-glass-btn notes-back" aria-label="Return" data-back="panel-notes"><img alt="Chevron Left" src="icons/chevron.left.svg" class="back-hero-icon" style="width:16px; height:16px; display:inline-block; vertical-align:-3px;" draggable="false"></button><button id="new-note-btn-mobile" class="notes-glass-btn" aria-label="New Note" title="New Note" style="position: absolute; right: 12px; display: none;"><img alt="Square and Pencil" src="icons/square.and.pencil.svg" style="width: 20px; height: 20px;" draggable="false"></button></div>
                    <div class="notes-header-right">
                        <button class="notes-toolbar-btn" data-command="bold" title="Bold"><img alt="Bold" src="icons/bold.svg"></button>
                        <button class="notes-toolbar-btn" data-command="italic" title="Italic"><img alt="Italic" src="icons/italic.svg"></button>
                        <button class="notes-toolbar-btn" data-command="underline" title="Underline"><img alt="Underline" src="icons/underline.svg"></button>
                        <button class="notes-toolbar-btn" data-command="strikeThrough" title="Strikethrough"><img alt="Strikethrough" src="icons/strikethrough.svg"></button>
                        <button class="notes-toolbar-btn" aria-label="Monostyle" id="notes-mono-btn" title="Monostyle"><span id="notes-mono-text">M</span></button>
                        <div class="toolbar-divider divider-indent" style="width: 1px; height: 16px; background: rgba(0,0,0,0.1); margin: 0 2px;"></div>
                        <button class="notes-toolbar-btn" data-command="outdent" title="Decrease Indent"><img alt="Increase Indent" src="icons/decrease.indent.svg"></button>
                        <button class="notes-toolbar-btn" data-command="indent" title="Increase Indent"><img alt="Increase Indent" src="icons/increase.indent.svg"></button>
                        <div class="toolbar-divider divider-lists" style="width: 1px; height: 16px; background: rgba(0,0,0,0.1); margin: 0 2px;"></div>
                        <button class="notes-toolbar-btn" data-command="insertUnorderedList" title="Bulleted List"><img alt="List Bullet" src="icons/list.bullet.svg"></button>
                        <button class="notes-toolbar-btn" data-command="insertOrderedList" title="Numbered List"><img alt="List Number" src="icons/list.number.svg"></button>
                        <button class="notes-toolbar-btn" id="notes-dash-btn" title="Dashed List" data-command="insertDashList"><img alt="List Dash" src="icons/list.dash.svg"></button>
                        <button class="notes-toolbar-btn" id="notes-checklist-btn" title="Checklist" data-command="insertChecklist"><img alt="Checklist" src="icons/checklist.svg"></button>
                    </div>
                </div>
                <div class="notes-content">
                    <div class="notes-date" id="active-note-date"></div>
                    <h2 class="notes-title" id="active-note-title" contenteditable="true" spellcheck="false" style="outline: none;"></h2>
                    <div id="active-note-content" contenteditable="true" spellcheck="false" style="outline: none; font-size:0.875rem; height:100%;"></div>
                </div>
            </div>
        </div>
        <div class="cursor-tooltip" id="cursor-tooltip">
            <div class="tooltip-content" id="tooltip-github">
                <div id="github-mini-grid" class="github-mini-grid"></div>
            </div>
        </div>
    </body>
</html>
