    <style>
        :root {
            color-scheme: light dark;
            --bg: light-dark(#fff, #1e1e1e);
            --gray: light-dark(#595959, #969696);
            --color: light-dark(#1e1e1e, #fff);
        }
        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--color);
            transition: background-color .2s ease, color .2s ease;
        }
        .notes-modal {
            position: fixed;
            visibility: hidden;
        }
        .title-text {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--color);
            cursor: pointer;
            user-select: none;
            z-index: 1999;
            gap: 1.5rem;
        }
        .title-text p {
            font-size: 1.5rem;
            margin: 0;
        }
        .title-text p:last-child {
            font-size: .75rem;
            bottom: 2rem;
            position: fixed;
        }
        .title-text.hidden {
            display: none;
        }
        .title-text a {
            font-size: .875rem;
            font-weight: 600;
            color: var(--color);
            text-decoration: none;
            background: none;
            backdrop-filter: blur(2px) brightness(120%);
            -webkit-backdrop-filter: blur(2px) brightness(120%);
            box-shadow: var(--shadow);
            border-radius: 999px;
            padding: .75rem 2.5rem;
            border: 0;
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            transition: backdrop-filter .2s cubic-bezier(.25, 1, .5, 1), transform .2s cubic-bezier(.25, 1, .5, 1), box-shadow .2s cubic-bezier(.25, 1, .5, 1);
        }
        .title-text a:hover {
            background: rgba(109, 109, 109, .15);
        }
    </style>

                    <div class="notes-header-left"><button class="notes-glass-btn notes-back" aria-label="Return" data-back="panel-notes"><svg class="icon back-hero-icon" style="width:1rem; height:1rem; display:inline-block; vertical-align:-3px;"><use href="#icon-chevron-left"/></svg></button><button id="new-note-btn-mobile" class="notes-glass-btn" aria-label="New Note" title="New Note" style="position: absolute; right: .75rem; display: none;"><svg class="icon" style="width:1.25rem;height:1.25rem;"><use href="#icon-square-and-pencil"/></svg></button></div>
                    <div class="notes-header-right">
                        <button class="notes-toolbar-btn" data-command="bold" title="Bold"><svg class="icon" style="width:.75rem;height:.75rem;"><use href="#icon-bold"/></svg></button>
                        <button class="notes-toolbar-btn" data-command="italic" title="Italic"><svg class="icon" style="width:.75rem;height:.75rem;"><use href="#icon-italic"/></svg></button>
                        <button class="notes-toolbar-btn" data-command="underline" title="Underline"><svg class="icon" style="width:1rem;height:1rem;transform:translateY(-.5px);"><use href="#icon-underline"/></svg></button>
                        <button class="notes-toolbar-btn" data-command="strikeThrough" title="Strikethrough"><svg class="icon" style="width:.875rem;height:.875rem;"><use href="#icon-strikethrough"/></svg></button>
                        <button class="notes-toolbar-btn" aria-label="Monostyle" id="notes-mono-btn" title="Monostyle"><span id="notes-mono-text" style="font-family:monospace;font-size:1rem;transform:translateY(.5px);">M</span></button>
                        <div class="toolbar-divider divider-indent" style="width:.0625rem;height:1rem;background:var(--gray);margin: 0 2px;"></div>
                        <button class="notes-toolbar-btn" data-command="outdent" title="Decrease Indent"><svg class="icon" style="width:1rem;height:1rem;"><use href="#icon-decrease-indent"/></svg></button>
                        <button class="notes-toolbar-btn" data-command="indent" title="Increase Indent"><svg class="icon" style="width:1rem;height:1rem;"><use href="#icon-increase-indent"/></svg></button>
                        <div class="toolbar-divider divider-lists" style="width:.0625rem;height:1rem;background:var(--gray);margin: 0 2px;"></div>
                        <button class="notes-toolbar-btn" data-command="insertUnorderedList" title="Bulleted List"><svg class="icon" style="width:1rem;height:1rem;"><use href="#icon-list-bullet"/></svg></button>
                        <button class="notes-toolbar-btn" data-command="insertOrderedList" title="Numbered List"><svg class="icon" style="width:1rem;height:1rem;"><use href="#icon-list-number"/></svg></button>
                        <button class="notes-toolbar-btn" id="notes-dash-btn" title="Dashed List" data-command="insertDashList"><svg class="icon" style="width:1rem;height:1rem;"><use href="#icon-list-dash"/></svg></button>
                        <button class="notes-toolbar-btn" id="notes-checklist-btn" title="Checklist" data-command="insertChecklist"><svg class="icon" style="width:1rem;height:1rem;"><use href="#icon-checklist"/></svg></button>
                    </div>
                </div>
                <div class="notes-content">
                    <div class="notes-date" id="active-note-date"></div>
                    <h2 class="notes-title" id="active-note-title" contenteditable="true" spellcheck="false" style="outline: none;"></h2>
                    <div id="active-note-content" contenteditable="true" spellcheck="false" style="outline: none; font-size:0.875rem;"></div>
                </div>
            </div>
            <div class="resize-handle resize-n" data-dir="n"></div>
            <div class="resize-handle resize-ne" data-dir="ne"></div>
            <div class="resize-handle resize-e" data-dir="e"></div>
            <div class="resize-handle resize-se" data-dir="se"></div>
            <div class="resize-handle resize-s" data-dir="s"></div>
            <div class="resize-handle resize-sw" data-dir="sw"></div>
            <div class="resize-handle resize-w" data-dir="w"></div>
            <div class="resize-handle resize-nw" data-dir="nw"></div>
        </div>
    </body>
</html>
