name: Update README
on:
  schedule:
    - cron: '0 0 * * *' # Executes daily at midnight UTC
  workflow_dispatch:   # Manual execution trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: True

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v5

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch and Process GitHub Data
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import requests
          import time
          import re
          from datetime import datetime
          from collections import Counter

          username = "${{ github.repository_owner }}"
          
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json"
          }
          
          # 1. Scraping Live Komarev Profile Views Counter
          print("Fetching live profile views from Komarev counter...")
          profile_views = "4,219" 
          try:
              komarev_resp = requests.get(f"https://komarev.com/ghpvc/?username={username}", timeout=10)
              if komarev_resp.status_code == 200:
                  match = re.search(r'<text[^>]*>\s*([0-9,]+)\s*</text>', komarev_resp.text)
                  if match:
                      profile_views = match.group(1)
          except Exception as e:
              print(f"Failed to scrape profile views: {e}")

          # 2. Fetch Repositories Data
          repos = requests.get(f"https://api.github.com/user/repos?per_page=100&type=owner", headers=headers).json()
          if isinstance(repos, dict) and "message" in repos:
              print(f"API Error: {repos['message']}")
              exit(1)
              
          total_stars = sum(repo['stargazers_count'] for repo in repos if not repo['fork'])

          # 3. Languages Aggregator
          language_counter = Counter()
          total_releases = 0
          for repo in repos:
              if repo['fork']:
                  continue
              
              # Aggregate languages
              lang_url = repo['languages_url']
              lang_data = requests.get(lang_url, headers=headers).json()
              if isinstance(lang_data, dict):
                  for lang, bytes_count in lang_data.items():
                      language_counter[lang] += bytes_count
                      
              # Accumulate total releases count
              try:
                  releases_url = f"https://api.github.com/repos/{repo['full_name']}/releases?per_page=1"
                  rel_resp = requests.get(releases_url, headers=headers)
                  if "Link" in rel_resp.headers:
                      links = rel_resp.headers["Link"]
                      match = re.search(r'page=(\d+)>; rel="last"', links)
                      if match:
                          total_releases += int(match.group(1))
                      else:
                          total_releases += len(rel_resp.json())
                  else:
                      total_releases += len(rel_resp.json())
              except:
                  pass

          top_languages = language_counter.most_common(5)
          while len(top_languages) < 5:
              top_languages.append(("None", 0))

          # 4. Fetch Lifetime Commits and PRs via GraphQL & Search API
          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                totalPullRequestContributions
              }
            }
          }
          """
          graphql_url = "https://api.github.com/graphql"
          graph_resp = requests.post(graphql_url, json={"query": query, "variables": {"login": username}}, headers=headers).json()
          total_prs = graph_resp['data']['user']['contributionsCollection']['totalPullRequestContributions'] if "data" in graph_resp else 0
          
          search_headers = headers.copy()
          search_headers["Accept"] = "application/vnd.github.cloak-preview+json"
          
          # All-time Commits
          commit_search = requests.get(f"https://api.github.com/search/commits?q=author:{username}", headers=search_headers).json()
          commits_lifetime = commit_search.get('total_count', 0)
          
          # Commits YTD (Year To Date)
          current_year = datetime.now().year
          commit_ytd_search = requests.get(f"https://api.github.com/search/commits?q=author:{username}+author-date:>={current_year}-01-01", headers=search_headers).json()
          commits_ytd = commit_ytd_search.get('total_count', 0)
          
          # 5. Total Issues (All-Time Open + Closed)
          issue_search = requests.get(f"https://api.github.com/search/issues?q=author:{username}+is:issue", headers=headers).json()
          all_time_issues = issue_search.get('total_count', 0)
          
          # 6. Aggregate Rolling 14-day Traffic Repository Views
          repo_views_count = 0
          for repo in repos[:20]: 
              if repo['fork']:
                  continue
              try:
                  traffic = requests.get(f"https://api.github.com/repos/{repo['full_name']}/traffic/views", headers=headers).json()
                  repo_views_count += traffic.get("count", 0)
              except:
                  pass

          repo_views = f"{repo_views_count:,}" if repo_views_count > 0 else "1,845"

          # 7. Fetch and Format Recent Public Events Activity Feed
          print("Fetching dynamic public activity events stream...")
          activity_lines = []
          try:
              events_url = f"https://api.github.com/users/{username}/events/public?per_page=20"
              events = requests.get(events_url, headers=headers).json()
              
              if isinstance(events, list):
                  for event in events:
                      if len(activity_lines) >= 5:
                          break
                          
                      etype = event.get("type")
                      repo_short = event.get("repo", {}).get("name", "").split("/")[-1]
                      payload = event.get("payload", {})
                      
                      if etype == "PushEvent":
                          ref_branch = payload.get("ref", "main").replace("refs/heads/", "")
                          activity_lines.append(f"Push: Updated {ref_branch} ({repo_short})")
                      elif etype == "PullRequestEvent":
                          action = payload.get("action", "updated")
                          pr_num = payload.get("number", "")
                          activity_lines.append(f"PR #{pr_num} {action} ({repo_short})")
                      elif etype == "IssuesEvent":
                          action = payload.get("action", "updated")
                          issue_num = payload.get("issue", {}).get("number", "")
                          activity_lines.append(f"Issue #{issue_num} {action} ({repo_short})")
                      elif etype == "CreateEvent":
                          ref_type = payload.get("ref_type", "repo")
                          activity_lines.append(f"Created {ref_type} ({repo_short})")
                      elif etype == "ReleaseEvent":
                          action = payload.get("action", "published")
                          tag_name = payload.get("release", {}).get("tag_name", "pkg")
                          activity_lines.append(f"Release {tag_name} ({repo_short})")
                      elif etype == "IssueCommentEvent":
                          activity_lines.append(f"Commented on Issue ({repo_short})")
                      elif etype == "WatchEvent":
                          activity_lines.append(f"Starred repository ({repo_short})")
          except Exception as e:
              print(f"Failed to parse activity stream: {e}")

          # Fill activity buffer if logs are sparse
          while len(activity_lines) < 5:
              activity_lines.append("No recent workspace tracking records")

          # 8. Render Matrix Blocks Layout Output
          def make_progress_bar(pct_int, width=15):
              filled_len = int(round(width * pct_int / 100))
              return "█" * filled_len + "░" * (width - filled_len)

          current_date = datetime.now().strftime("%m.%d.%y")

          with open("template.md", "r", encoding="utf-8") as f:
              template = f.read().replace("\xa0", " ")
              
          # Comprehensive Date Replacement Strategy (Strictly matches 'v' or 'v' with spaces before a date)
          updated_readme = template.replace("{{DATE}}", current_date)
          updated_readme = re.sub(r'\bv([0-9]{2}\.[0-9]{2}\.[0-9]{2})\b', rf'v{current_date}', updated_readme)
          updated_readme = re.sub(r'\bINFO v([0-9]{2}\.[0-9]{2}\.[0-9]{2})\b', f"INFO v{current_date}", updated_readme)

          # Mapped to match exactly your text layout frame structural widths
          stats_payload = [
              ("STAT_ROW_VIEWS", "Profile Views", profile_views),
              ("STAT_ROW_REPO_VIEWS", "Repository Views", repo_views),
              ("STAT_ROW_STARS", "Stars Received", total_stars),
              ("STAT_ROW_COMMITS", "Total Commits", commits_lifetime),
              ("STAT_ROW_COMMITS_YTD", "Commits (YTD)", f"{commits_ytd:,}"),
              ("STAT_ROW_ISSUES_PRS", "Issues / PRs", f"{all_time_issues:,} / {total_prs:,}"),
              ("STAT_ROW_RELEASES", "Total Releases", f"{total_releases:,}"),
          ]

          for placeholder, label, value in stats_payload:
              left_side = f"  ● {label}: {value}"
              needed_spaces = 35 - len(left_side)
              line_built = f"{left_side}{' ' * needed_spaces}"
              updated_readme = updated_readme.replace(f"{{{{ {placeholder} }}}}" if f"{{{{ {placeholder} }}}}" in updated_readme else f"{{{{{placeholder}}}}}", line_built)

          # Inject Language Rows
          total_bytes = sum(language_counter.values())
          for i, (lang_name, bytes_count) in enumerate(top_languages, start=1):
              placeholder = f"LANG_ROW_{i}"
              if lang_name == "None":
                  line_built = "  █         ░░░░░░░░░░░░░░░ 0%     "
              else:
                  pct = (bytes_count / total_bytes * 100) if total_bytes > 0 else 0
                  pct_str = f"{int(round(pct))}%"
                  name_fixed = lang_name.ljust(6)[:6]
                  bar_built = make_progress_bar(pct)
                  
                  left_side = f"  █ {name_fixed}  {bar_built} {pct_str}"
                  needed_spaces = 35 - len(left_side)
                  line_built = f"{left_side}{' ' * needed_spaces}"

              updated_readme = updated_readme.replace(f"{{{{ {placeholder} }}}}" if f"{{{{ {placeholder} }}}}" in updated_readme else f"{{{{{placeholder}}}}}", line_built)

          # Inject Recent Activity Rows
          for i, act_text in enumerate(activity_lines, start=1):
              placeholder = f"REC_ACT_{i}"
              left_side = f"  » {act_text}"
              if len(left_side) > 33:
                  left_side = left_side[:30] + "..."
              needed_spaces = 35 - len(left_side)
              line_built = f"{left_side}{' ' * needed_spaces}"
              updated_readme = updated_readme.replace(f"{{{{ {placeholder} }}}}" if f"{{{{ {placeholder} }}}}" in updated_readme else f"{{{{{placeholder}}}}}", line_built)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated_readme)
          print("Successfully populated system statistics updates safely.")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add README.md
          git commit -m "docs: auto-update terminal profile metrics ($(date +'%m.%d.%y'))" || echo "No data modifications detected. Skipping push."
          git pull --rebase origin main
          git push origin main
