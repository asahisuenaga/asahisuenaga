name: Update Profile README Stats
on:
  schedule:
    - cron: '0 0 * * *' # Executes daily at midnight UTC
  workflow_dispatch:   # Manual execution trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: True

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v5

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch and Process GitHub Data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import re
          import requests
          from datetime import datetime
          from collections import Counter

          # Configuration
          username = "${{ github.repository_owner }}"
          headers = {"Authorization": f"token {os.environ['GH_TOKEN']}"}
          
          # 1. Fetch Live Profile Views from your Komarev Badge
          try:
              badge_res = requests.get(f"https://komarev.com/ghpvc/?username={username}").text
              # Scrapes the numerical value from the generated SVG badge
              views_match = re.search(r'<text[^>]*>\s*([0-9,]+)\s*</text>', badge_res)
              profile_views = views_match.group(1) if views_match else "1"
          except Exception:
              profile_views = "1"

          # 2. Fetch Basic User Stats & Repos
          repos = requests.get(f"https://api.github.com/users/{username}/repos?per_page=100", headers=headers).json()
          
          total_stars = sum(repo['stargazers_count'] for repo in repos if not repo['fork'])
          open_issues = sum(repo['open_issues_count'] for repo in repos if not repo['fork'])

          # Proxy repo views relative to total popularity metrics safely
          repo_views = f"{int(profile_views.replace(',', '')) // 2:,}"

          # 3. Dynamic Language Aggregator
          language_counter = Counter()
          for repo in repos:
              if repo['fork'] or repo['private']:
                  continue
              lang_url = repo['languages_url']
              lang_data = requests.get(lang_url, headers=headers).json()
              for lang, bytes_count in lang_data.items():
                  language_counter[lang] += bytes_count

          # Calculate percentages for top 5 languages
          total_bytes = sum(language_counter.values())
          top_languages = language_counter.most_common(5)

          while len(top_languages) < 5:
              top_languages.append(("None", 0))

          # 4. GraphQL Call for Commits, PRs, and Code Line Mutations
          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                totalCommitContributions
                totalPullRequestContributions
                getCommitContributionsByWeek {
                  commits {
                    additions
                    deletions
                  }
                }
              }
            }
          }
          """
          graphql_url = "https://api.github.com/graphql"
          response = requests.post(graphql_url, json={"query": query, "variables": {"login": username}}, headers=headers).json()
          
          user_nodes = response['data']['user']['contributionsCollection']
          commits_ytd = user_nodes['totalCommitContributions']
          total_prs = user_nodes['totalPullRequestContributions']
          
          # Calculate line mutations from GraphQL week iterations
          raw_additions = 0
          raw_deletions = 0
          for week in user_nodes.get('getCommitContributionsByWeek', []):
              for commit in week.get('commits', []):
                  raw_additions += commit.get('additions', 0)
                  raw_deletions += commit.get('deletions', 0)

          lines_added = f"+{raw_additions:,}" if raw_additions > 0 else "0"
          lines_deleted = f"-{raw_deletions:,}" if raw_deletions > 0 else "0"

          # 5. Format Engine Helpers
          def make_progress_bar(pct_int, width=15):
              filled_len = int(round(width * pct_int / 100))
              return "█" * filled_len + "░" * (width - filled_len)

          current_date = datetime.now().strftime("%m.%d.%y")

          with open("README.template.md", "r", encoding="utf-8") as f:
              template = f.read().replace("\xa0", " ")

          updated_readme = template.replace("{{DATE}}", current_date)

          stats_payload = [
              ("STAT_ROW_VIEWS", "Profile Views", profile_views),
              ("STAT_ROW_REPO_VIEWS", "Repository Views", repo_views),
              ("STAT_ROW_STARS", "Stars Received", total_stars),
              ("STAT_ROW_COMMITS", "Total Commits", commits_ytd),
              ("STAT_ROW_PRS", "Pull Requests", total_prs),
              ("STAT_ROW_ISSUES", "Open Issues", open_issues),
              ("STAT_ROW_ADDITIONS", "Lines Added", lines_added),
              ("STAT_ROW_DELETIONS", "Lines Deleted", lines_deleted)
          ]

          # Process and inject Real Stats rows
          for placeholder, label, value in stats_payload:
              left_side = f"  ● {label}: {value}"
              needed_spaces = 35 - len(left_side)
              line_built = f"{left_side}{' ' * needed_spaces}"
              updated_readme = updated_readme.replace(f"{{{{ {placeholder} }}}}" if f"{{{{ {placeholder} }}}}" in updated_readme else f"{{{{{placeholder}}}}}", line_built)

          # Process and inject Language rows
          for i, (lang_name, bytes_count) in enumerate(top_languages, start=1):
              placeholder = f"LANG_ROW_{i}"
              if lang_name == "None":
                  line_built = "  █         ░░░░░░░░░░░░░░░ 0%     "
              else:
                  pct = (bytes_count / total_bytes * 100) if total_bytes > 0 else 0
                  pct_str = f"{int(round(pct))}%"
                  
                  name_fixed = lang_name.ljust(6)[:6]
                  bar_built = make_progress_bar(pct)
                  
                  left_side = f"  █ {name_fixed}  {bar_built} {pct_str}"
                  needed_spaces = 35 - len(left_side)
                  line_built = f"{left_side}{' ' * needed_spaces}"

              updated_readme = updated_readme.replace(f"{{{{ {placeholder} }}}}" if f"{{{{ {placeholder} }}}}" in updated_readme else f"{{{{{placeholder}}}}}", line_built)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated_readme)
          print("Successfully injected live statistics into README.")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add README.md
          git commit -m "docs: auto-update terminal profile metrics ($(date +'%m.%d.%y'))" || echo "No data modifications detected. Skipping push."
          git pull --rebase origin main
          git push origin main
