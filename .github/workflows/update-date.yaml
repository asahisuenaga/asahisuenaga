name: Update README Date
on:
  schedule:
    - cron: '0 0 * * *' # Every night
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest 
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      
      - name: Update Date
        run: |
          DATE=$(date +'%m.%d.%y')
          # Matches either '{{DATE}}' OR an existing 'MM.DD.YY' sequence right after 'v'
          sed -i -E "s/(INFO v|v)\{\{DATE\}\}/\1$DATE/g; s/(INFO v|v)[0-9]{2}\.[0-9]{2}\.[0-9]{2}/\1$DATE/g" README.md
          
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          # Only commits if there is a change to prevent workflow failure
          git commit -m "Update README version to $(date +'%m.%d.%y')" || echo "No changes to commit"
          git push
